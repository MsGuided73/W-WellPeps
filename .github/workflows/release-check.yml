# Release check (compliance build list W12): runs on every push to main and on every pull request.
#
# It runs wellpeps-site/scripts/release-check.mjs: the unit tests (which include the unsupported-claims
# guard and the legal-document hygiene tests), the type check, a production build with the draft legal
# pages OFF, the LegitScript disclosure scan against the recorded gaps, and the strict-policy browser check.
#
# This workflow reports; it does not block a deploy (Coolify deploys from main on its own). To block, make
# "Release check" a required status check in the repository's branch protection.
#
# One-time setup: the production build reads the Learning Center from Supabase, so add two repository
# secrets (Settings > Secrets and variables > Actions): SUPABASE_URL and SUPABASE_PUBLISHABLE_KEY. They are
# the same two values the deploy host uses as build variables. Until they exist the workflow does not fail:
# it skips the check and prints a warning saying what to add.
name: Release check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  release-check:
    name: Release check
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: wellpeps-site
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - name: Are the build secrets present?
        id: secrets
        # Before checkout the default folder (wellpeps-site) does not exist yet.
        working-directory: ${{ github.workspace }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Release check skipped::Add the repository secrets SUPABASE_URL and SUPABASE_PUBLISHABLE_KEY (Settings > Secrets and variables > Actions). The production build reads the Learning Center from Supabase."
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.secrets.outputs.ok == 'true'
        uses: actions/checkout@v4

      - if: steps.secrets.outputs.ok == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: wellpeps-site/package-lock.json

      # The LegitScript disclosure scanner is a Python script (standard library only).
      - if: steps.secrets.outputs.ok == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - if: steps.secrets.outputs.ok == 'true'
        run: npm ci

      - name: Install the browser the strict-policy check drives
        if: steps.secrets.outputs.ok == 'true'
        run: npx playwright install --with-deps chromium

      - name: Release check
        if: steps.secrets.outputs.ok == 'true'
        run: node scripts/release-check.mjs --browser
